---
name: mainマージ後リリース

"on":
  push:
    branches:
      - main
    paths:
      - languages/**
      - .n8n-upstream-version
      - docker-compose.yml
      - Dockerfile.n8n-ja
      - fix_editor-ui.patch
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-ja
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
      n8n_tag: ${{ steps.version.outputs.n8n_tag }}
      n8n_version: ${{ steps.version.outputs.n8n_version }}
      ja_tag: ${{ steps.tag.outputs.tag }}
      release_name: ${{ steps.tag.outputs.release_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve upstream n8n version
        id: version
        run: |
          set -euo pipefail

          if [[ -f .n8n-upstream-version ]]; then
            raw=$(cat .n8n-upstream-version | tr -d '[:space:]')
          else
            raw=$(grep -E '^\s*image:\s*n8nio/n8n:' docker-compose.yml | sed -E 's#^\s*image:\s*n8nio/n8n:##')
          fi

          raw="$(echo "$raw" | tr -d '[:space:]')"

          if [[ "$raw" =~ ^n8n@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            tag="$raw"
            version="${raw#n8n@}"
          elif [[ "$raw" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version="$raw"
            tag="n8n@$version"
          else
            echo "Invalid n8n version source: '$raw'"
            echo "Use explicit version format 'x.y.z' or 'n8n@x.y.z' in .n8n-upstream-version or docker-compose.yml"
            exit 1
          fi

          echo "n8n_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "n8n_version=$version" >> "$GITHUB_OUTPUT"

      - name: Compute ja release tag
        id: tag
        run: |
          set -euo pipefail
          base="${{ steps.version.outputs.n8n_version }}-ja"
          latest=$(git tag -l "${base}.*" | sed -E 's#.*-ja\.##' | sort -n | tail -n1)

          if [[ -z "$latest" ]]; then
            next=1
          else
            next=$((latest + 1))
          fi

          full_tag="${base}.${next}"
          echo "tag=$full_tag" >> "$GITHUB_OUTPUT"
          echo "release_name=n8n ${{ steps.version.outputs.n8n_version }} 日本語化 ${full_tag}" >> "$GITHUB_OUTPUT"

      - name: Decide whether a release is needed
        id: decide
        run: |
          set -euo pipefail

          # 手動実行は常に強制リリース。
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: forcing release."
            exit 0
          fi

          version="${{ steps.version.outputs.n8n_version }}"
          base="${version}-ja"
          latest=$(git tag -l "${base}.*" | sed -E 's#.*-ja\.##' | sort -n | tail -n1)

          # 当該バージョンの既存リリースが無ければ実行。
          if [[ -z "$latest" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "No prior ${base} release; proceeding."
            exit 0
          fi

          prev_tag="${base}.${latest}"

          # 公開イメージに影響するビルド入力（翻訳・パッチ・バージョン・Dockerfile）が
          # 既存リリース以降いずれも未変更なら、重複リリースを抑止する。
          release_inputs=(
            languages/ja.json
            fix_editor-ui.patch
            .n8n-upstream-version
            Dockerfile.n8n-ja
          )
          if git diff --quiet "refs/tags/${prev_tag}" HEAD -- "${release_inputs[@]}"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release inputs unchanged since ${prev_tag}; skipping redundant release."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Release inputs changed since ${prev_tag}; proceeding."
          fi

  release:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x

      - name: Setup corepack and pnpm
        run: |
          set -euo pipefail
          # corepack 0.31 cannot run pnpm 12 (looks for bin/pnpm.cjs; pnpm 12 ships a native
          # binary), which broke `pnpm install` from n8n 2.40. 0.36 handles it.
          npm i -g corepack@0.36
          corepack enable

      - name: Checkout n8n source
        uses: actions/checkout@v5
        with:
          repository: n8n-io/n8n
          ref: ${{ needs.guard.outputs.n8n_tag }}
          path: n8n

      - name: Install n8n dependencies
        run: pnpm install --frozen-lockfile
        working-directory: n8n

      - name: Resolve editor-ui directory
        id: editorui
        run: |
          set -euo pipefail
          new_path="$GITHUB_WORKSPACE/n8n/packages/frontend/editor-ui"
          old_path="$GITHUB_WORKSPACE/n8n/packages/editor-ui"

          if [[ -d "$new_path" ]]; then
            echo "flag=new" >> "$GITHUB_OUTPUT"
            echo "dir=$new_path" >> "$GITHUB_OUTPUT"
          else
            echo "flag=old" >> "$GITHUB_OUTPUT"
            echo "dir=$old_path" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve locale directory
        id: locales
        run: |
          set -euo pipefail
          modern_locale_path="$GITHUB_WORKSPACE/n8n/packages/frontend/@n8n/i18n/src/locales"
          new_locale_path="${{ steps.editorui.outputs.dir }}/src/plugins/i18n/locales"
          old_locale_path="$GITHUB_WORKSPACE/n8n/packages/editor-ui/src/plugins/i18n/locales"

          if [[ -d "$modern_locale_path" ]]; then
            echo "dir=$modern_locale_path" >> "$GITHUB_OUTPUT"
          elif [[ -d "$new_locale_path" ]]; then
            echo "dir=$new_locale_path" >> "$GITHUB_OUTPUT"
          elif [[ -d "$old_locale_path" ]]; then
            echo "dir=$old_locale_path" >> "$GITHUB_OUTPUT"
          else
            echo "Unable to find locale directory in checked out n8n source" >&2
            exit 1
          fi

      - name: Apply Japanese locale and patch
        run: |
          set -euo pipefail
          cp -r "$GITHUB_WORKSPACE/languages"/* "${{ steps.locales.outputs.dir }}/"

          patch_applied=false
          for patch in fix_editor-ui.patch fix_editor-ui.old.patch; do
            if git -C "$GITHUB_WORKSPACE/n8n" apply --check "$GITHUB_WORKSPACE/$patch" >/dev/null 2>&1; then
              git -C "$GITHUB_WORKSPACE/n8n" apply "$GITHUB_WORKSPACE/$patch"
              echo "Applied patch: $patch"
              patch_applied=true
              break
            fi
          done

          if [[ "$patch_applied" == "false" ]]; then
            fixed_new_path="$GITHUB_WORKSPACE/n8n/packages/frontend/editor-ui/src/features/credentials/components/CredentialEdit/CredentialConfig.vue"
            fixed_old_path="$GITHUB_WORKSPACE/n8n/packages/frontend/editor-ui/src/components/CredentialEdit/CredentialConfig.vue"
            legacy_old_path="$GITHUB_WORKSPACE/n8n/packages/editor-ui/src/components/CredentialEdit/CredentialConfig.vue"
            app_vue_path="$GITHUB_WORKSPACE/n8n/packages/frontend/editor-ui/src/app/App.vue"

            if { [[ -f "$fixed_new_path" ]] && grep -Fq 'if (!credTranslation) return;' "$fixed_new_path"; } || \
               { [[ -f "$fixed_old_path" ]] && grep -Fq 'if (!credTranslation) return;' "$fixed_old_path"; } || \
               { [[ -f "$legacy_old_path" ]] && grep -Fq 'if (!credTranslation) return;' "$legacy_old_path"; } || \
               { [[ -f "$app_vue_path" ]] && grep -Fq "loadLanguage('ja'" "$app_vue_path"; }; then
              echo "Patch not applied, but upstream already contains the fix."
            else
              echo "No compatible editor-ui patch found and fix was not detected in source." >&2
              exit 1
            fi
          fi

      - name: Ensure HtmlEditor dependency exists
        run: |
          set -euo pipefail
          workspace_pkg_dir="$GITHUB_WORKSPACE/n8n/packages/frontend/@n8n/codemirror-lang-html"
          editor_ui_pkg="${{ steps.editorui.outputs.dir }}/package.json"

          if [[ ! -f "$editor_ui_pkg" ]]; then
            echo "editor-ui package.json not found at: $editor_ui_pkg"
            exit 1
          fi

          if [[ ! -d "$workspace_pkg_dir" ]]; then
            echo "Workspace package not found: $workspace_pkg_dir"
            echo "Skip fallback install for @n8n/codemirror-lang-html"
            exit 0
          fi

          if grep -q '"@n8n/codemirror-lang-html"' "$editor_ui_pkg"; then
            echo "@n8n/codemirror-lang-html is already declared in editor-ui dependencies"
            exit 0
          fi

          pnpm --filter n8n-editor-ui add @n8n/codemirror-lang-html@workspace:* --no-frozen-lockfile
        working-directory: n8n

      - name: Build editor-ui with dependencies
        run: pnpm --filter n8n-editor-ui... build
        working-directory: n8n

      - name: Verify Japanese localization artifacts
        run: |
          set -euo pipefail
          assets_dir="${{ steps.editorui.outputs.dir }}/dist/assets"
          app_vue_path="$GITHUB_WORKSPACE/n8n/packages/frontend/editor-ui/src/app/App.vue"
          locale_file="${{ steps.locales.outputs.dir }}/ja.json"

          if [[ ! -d "$assets_dir" ]]; then
            echo "assets directory not found: $assets_dir" >&2
            exit 1
          fi

          ja_count=$(find "$assets_dir" -maxdepth 1 -type f -name 'ja-*.js' | wc -l | tr -d '[:space:]')
          echo "ja bundle count: $ja_count"

          if [[ "$ja_count" == "0" ]]; then
            echo "No Japanese chunk found in $assets_dir (ja-*.js)." >&2
            echo "Files containing 'ja' for debugging:" >&2
            find "$assets_dir" -maxdepth 1 -type f -iname '*ja*' -exec basename {} \; || true

            if [[ -f "$app_vue_path" ]] && grep -Fq "loadLanguage('ja'" "$app_vue_path" && [[ -f "$locale_file" ]]; then
              echo "Runtime ja.json loading patch detected and locale source exists: $locale_file"
              echo "Proceeding without ja-*.js chunk."
              exit 0
            fi

            echo "Neither ja-*.js chunks nor runtime ja loading patch was detected." >&2
            echo "Expected marker: loadLanguage('ja' in $app_vue_path" >&2
            echo "Expected locale file: $locale_file" >&2
            exit 1
          fi

      - name: Export editor-ui-dist
        run: |
          set -euo pipefail
          rm -rf editor-ui-dist
          cp -r "${{ steps.editorui.outputs.dir }}/dist" editor-ui-dist
          cp "$GITHUB_WORKSPACE/languages/ja.json" editor-ui-dist/ja.json
      - name: Create editor-ui archive
        run: |
          set -euo pipefail
          tar -czf editor-ui.tar.gz editor-ui-dist

      - name: Verify ja.json in editor-ui archive
        run: |
          set -euo pipefail
          archive_listing="$RUNNER_TEMP/editor-ui-archive-list.txt"
          tar -tzf editor-ui.tar.gz > "$archive_listing"

          if ! grep -q '^editor-ui-dist/ja.json$' "$archive_listing"; then
            echo "ja.json is missing in editor-ui.tar.gz" >&2
            echo "Archive contents:" >&2
            head -n 50 "$archive_listing" >&2
            exit 1
          fi

      - name: Create GitHub release
        if: ${{ !env.ACT }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.guard.outputs.ja_tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.guard.outputs.release_name }}
          body: |
            n8n `${{ needs.guard.outputs.n8n_version }}` 対応の日本語化リリースです。

            - Docker image: `${{ secrets.DOCKERHUB_USERNAME }}/n8n-ja:${{ needs.guard.outputs.ja_tag }}`
            - `ja.json` を添付
            - `editor-ui.tar.gz` を添付
          draft: false
          prerelease: false
          files: |
            languages/ja.json
            editor-ui.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ !env.ACT }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ja image
        if: ${{ !env.ACT }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.n8n-ja
          push: true
          build-args: |
            N8N_VERSION=${{ needs.guard.outputs.n8n_version }}
            EDITOR_UI_ARCHIVE_URL=https://github.com/${{ github.repository }}/releases/download/${{ needs.guard.outputs.ja_tag }}/editor-ui.tar.gz
            INSTALL_CLAUDE_CODE=true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/n8n-ja:${{ needs.guard.outputs.ja_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/n8n-ja:latest-ja

      - name: Create and push git tag
        if: ${{ !env.ACT }}
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if git ls-remote --tags origin "refs/tags/${{ needs.guard.outputs.ja_tag }}" | grep -q .; then
            echo "Tag already exists on origin: ${{ needs.guard.outputs.ja_tag }}"
            exit 0
          fi

          git tag "${{ needs.guard.outputs.ja_tag }}"
          git push origin "${{ needs.guard.outputs.ja_tag }}"
