---
name: PR検証

"on":
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    yaml-workflow-lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Validate YAML syntax
              run: |
                  set -euo pipefail
                  python3 -m pip install --user yamllint
                  ~/.local/bin/yamllint -d '{extends: default, rules: {line-length: disable}}' .github/workflows

            - name: Lint GitHub Actions workflows
              uses: rhysd/actionlint@v1.7.12

    format-check:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 22

            - name: Install dependencies
              run: npm ci

            - name: Validate JSON files
              run: |
                  set -euo pipefail
                  node - <<'NODE'
                  const fs = require('fs');
                  const files = [
                    'languages/ja.json',
                    'script/en.json',
                    '.env.example',
                    'docker-compose.yml',
                  ];

                  // Strict JSON check for locale files
                  for (const file of ['languages/ja.json', 'script/en.json']) {
                    JSON.parse(fs.readFileSync(file, 'utf8'));
                  }

                  // Basic presence check for other tracked files
                  for (const file of files) {
                    if (!fs.existsSync(file)) {
                      throw new Error(`Missing file: ${file}`);
                    }
                  }

                  console.log('JSON and required file checks passed.');
                  NODE

            - name: Check translator script syntax
              run: node --check script/translate-google.js

    n8n-smoke-test:
        runs-on: ubuntu-latest
        needs:
            - yaml-workflow-lint
            - format-check
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Prepare environment file
              run: cp .env.example .env

            - name: Start n8n container
              run: docker compose up -d n8ntest

            - name: Wait until n8n responds
              run: |
                  set -euo pipefail
                  deadline=$((SECONDS + 240))

                  while true; do
                    code=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:15678 || true)

                    # n8n version/configurationによっては / が 404 を返すため、
                    # 5xx以外のHTTP応答が返っていれば起動済みとみなす
                    if [[ "$code" =~ ^[1-4][0-9][0-9]$ ]]; then
                      echo "n8n is reachable (HTTP $code)"
                      break
                    fi

                    if (( SECONDS >= deadline )); then
                      echo "Timeout waiting for n8n (last HTTP ${code:-none})"
                      exit 1
                    fi

                    echo "waiting for n8n... (HTTP ${code:-none})"
                    sleep 3
                  done

            - name: Verify container status
              run: docker compose ps

            - name: Dump logs on failure
              if: failure()
              run: docker compose logs n8ntest

            - name: Shutdown containers
              if: always()
              run: docker compose down -v

    n8n-ja-smoke-test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Resolve n8n version
              id: n8n_version
              run: echo "value=$(cat .n8n-upstream-version)" >> "$GITHUB_OUTPUT"

            - name: Create dummy editor-ui archive
              run: |
                  set -euo pipefail
                  mkdir -p editor-ui-dist
                  touch editor-ui-dist/placeholder.txt
                  tar -czf editor-ui.tar.gz editor-ui-dist

            - name: Serve dummy editor-ui archive locally
              run: |
                  set -euo pipefail
                  python3 -m http.server 8080 --directory . &
                  for _ in $(seq 1 10); do
                    if curl -fsS -o /dev/null http://127.0.0.1:8080/editor-ui.tar.gz; then
                      exit 0
                    fi
                    sleep 1
                  done
                  echo "Dummy archive server did not come up in time" >&2
                  exit 1

            # docker/setup-buildx-action は buildkit を別コンテナで起動する
            # docker-container ドライバに切り替わり、--network=host が
            # ランナー自身のループバックではなくそのコンテナのものを指して
            # しまい、127.0.0.1:8080 のダミーアーカイブに到達できない。
            # ランナー標準の docker ドライバ(dockerdと同一ネットワーク)の
            # ままにするため、このステップは追加しない。
            - name: Build n8n-ja image
              run: |
                  set -euo pipefail
                  docker buildx build \
                    --network=host \
                    --load \
                    -f Dockerfile.n8n-ja \
                    -t n8n-ja-smoke:test \
                    --build-arg N8N_VERSION=${{ steps.n8n_version.outputs.value }} \
                    --build-arg EDITOR_UI_ARCHIVE_URL=http://127.0.0.1:8080/editor-ui.tar.gz \
                    .

            # 同梱ツール群(python3/jq/curl/yq/zip/unzip)が最終イメージで実際に
            # 動くかはビルドが通るだけでは分からない(共有ライブラリ不足は実行時
            # エラーになる)ため、起動確認と実処理(HTTPS取得・zip往復・yaml変換)
            # まで実行して検証する。
            - name: Verify bundled CLI tools start
              run: |
                  set -euo pipefail
                  docker run --rm --entrypoint python3 n8n-ja-smoke:test --version
                  docker run --rm --entrypoint jq n8n-ja-smoke:test --version
                  docker run --rm --entrypoint curl n8n-ja-smoke:test --version
                  docker run --rm --entrypoint yq n8n-ja-smoke:test --version
                  docker run --rm --entrypoint zip n8n-ja-smoke:test -v
                  docker run --rm --entrypoint unzip n8n-ja-smoke:test -v

            - name: Verify curl HTTPS connectivity
              run: docker run --rm --entrypoint curl n8n-ja-smoke:test -fsSL -o /dev/null -w 'HTTP %{http_code}\n' https://example.com

            - name: Verify zip/unzip/yq round-trip
              run: |
                  set -euo pipefail
                  workdir="$RUNNER_TEMP/n8n-ja-tool-test"
                  mkdir -p "$workdir"
                  echo hello > "$workdir/a.txt"
                  printf 'a: 1\nb: 2\n' > "$workdir/in.yaml"
                  docker run --rm -v "$workdir:/work" -w /work --entrypoint zip n8n-ja-smoke:test t.zip a.txt
                  docker run --rm -v "$workdir:/work" -w /work --entrypoint unzip n8n-ja-smoke:test -o t.zip -d extracted
                  grep -qx hello "$workdir/extracted/a.txt"
                  docker run --rm -v "$workdir:/work" -w /work --entrypoint yq n8n-ja-smoke:test -o=json in.yaml
