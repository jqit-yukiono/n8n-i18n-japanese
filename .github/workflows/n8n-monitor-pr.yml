---
name: n8n更新監視とPR作成

"on":
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: n8n-monitor
  cancel-in-progress: false

jobs:
  detect-and-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve current tracked n8n version
        id: current
        run: |
          set -euo pipefail
          if [[ -f .n8n-upstream-version ]]; then
            current=$(tr -d '[:space:]' < .n8n-upstream-version)
          else
            current=$(grep -E '^\s*image:\s*n8nio/n8n:' docker-compose.yml | sed -E 's#^\s*image:\s*n8nio/n8n:##' | tr -d '[:space:]')
          fi
          current="${current#n8n@}"
          # 現在バージョンが解決できないと CUR_MAJOR が空になり後段の追従判定が
          # 破綻するため、ここで明示的に停止して原因を特定しやすくする。
          if ! [[ "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "現在追従中の n8n バージョンを x.y.z 形式で解決できません: '$current'" >&2
            echo ".n8n-upstream-version または docker-compose.yml の image タグを確認してください。" >&2
            exit 1
          fi
          echo "version=$current" >> "$GITHUB_OUTPUT"
          echo "major=${current%%.*}" >> "$GITHUB_OUTPUT"
          echo "Current tracked n8n version: $current (major ${current%%.*})"

      - name: Resolve latest n8n version tag
        id: latest
        env:
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUR_MAJOR: ${{ steps.current.outputs.major }}
        run: |
          set -euo pipefail

          gh_api() {
            curl -fsSL --retry 5 --retry-delay 5 --retry-connrefused \
              -H "Authorization: Bearer ${GH_API_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$1"
          }

          releases=$(gh_api "https://api.github.com/repos/n8n-io/n8n/releases?per_page=100")

          # 現在追従中のメジャー内で安定版(n8n@X.Y.Z)の semver 最大を採用する。
          # releases API は公開日順で返り、n8n は旧マイナー系へパッチをバックポート
          # 公開するため、先頭(=最新公開)ではなく semver 最大を選ばないと過去
          # バージョンを掴む。prerelease/draft は除外(next/RC を自動ビルド対象外)。
          # メジャー越えは editor-ui patch 非互換のリスクがあるため自動追従せず、
          # .n8n-upstream-version のメジャーを人手で上げたときだけ移行する。
          tag=$(jq -r --arg M "$CUR_MAJOR" '[.[] | select(.prerelease == false and .draft == false) | .tag_name | select(test("^n8n@[0-9]+\\.[0-9]+\\.[0-9]+$")) | select((ltrimstr("n8n@") | split(".")[0]) == $M)] | sort_by(ltrimstr("n8n@") | split(".") | map(tonumber)) | last // ""' <<<"$releases")

          # Fallback for API anomalies. tags API は prerelease 情報を持たないため
          # 安定版に限定できない点に注意(releases API が空を返す稀なケースの保険)。
          if [[ -z "$tag" || "$tag" == "null" ]]; then
            tag=$(gh_api "https://api.github.com/repos/n8n-io/n8n/tags?per_page=100" \
              | jq -r --arg M "$CUR_MAJOR" '[.[].name | select(test("^n8n@[0-9]+\\.[0-9]+\\.[0-9]+$")) | select((ltrimstr("n8n@") | split(".")[0]) == $M)] | sort_by(ltrimstr("n8n@") | split(".") | map(tonumber)) | last // ""')
          fi

          if [[ -z "$tag" || "$tag" == "null" ]]; then
            echo "Failed to resolve a concrete n8n release tag"
            exit 1
          fi

          # より新しい安定版メジャーが存在する場合は通知のみ(自動追従はしない)。
          newer_major=$(jq -r '[.[] | select(.prerelease == false and .draft == false) | .tag_name | select(test("^n8n@[0-9]+\\.[0-9]+\\.[0-9]+$")) | (ltrimstr("n8n@") | split(".")[0] | tonumber)] | max // 0' <<<"$releases")
          if [[ "$newer_major" -gt "$CUR_MAJOR" ]]; then
            echo "::warning::新しいメジャー n8n v${newer_major} が存在します(現在 major ${CUR_MAJOR})。メジャー移行は editor-ui patch 更新を伴うため、.n8n-upstream-version のメジャーを手動で更新してください。"
          fi

          version="${tag#n8n@}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved n8n tag: $tag (major ${CUR_MAJOR} 内の semver 最大)"

      - name: Skip if release already published
        id: already_done
        run: |
          set -euo pipefail
          if [[ "${{ steps.current.outputs.version }}" == "${{ steps.latest.outputs.version }}" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already tracking latest n8n version: ${{ steps.latest.outputs.version }}"
            exit 0
          fi

          pattern="${{ steps.latest.outputs.version }}-ja.*"
          if git ls-remote --tags origin "refs/tags/${pattern}" | grep -q .; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Detected existing ja release tag for version ${{ steps.latest.outputs.version }}"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.already_done.outputs.skip == 'false'
        uses: actions/setup-node@v5
        with:
          node-version: 22.x

      - name: Setup corepack and pnpm
        if: steps.already_done.outputs.skip == 'false'
        run: |
          set -euo pipefail
          # corepack 0.31 cannot run pnpm 12 (looks for bin/pnpm.cjs; pnpm 12 ships a native
          # binary), which broke `pnpm install` from n8n 2.40. 0.36 handles it.
          npm i -g corepack@0.36
          corepack enable

      - name: Checkout n8n source
        if: steps.already_done.outputs.skip == 'false'
        uses: actions/checkout@v5
        with:
          repository: n8n-io/n8n
          ref: ${{ steps.latest.outputs.tag }}
          path: n8n

      - name: Auto refresh editor-ui patch
        if: steps.already_done.outputs.skip == 'false'
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/script/update-editor-ui-patch.sh" \
            "$GITHUB_WORKSPACE/n8n" \
            "$GITHUB_WORKSPACE/fix_editor-ui.patch"

      - name: Install n8n dependencies
        if: steps.already_done.outputs.skip == 'false'
        run: pnpm install --frozen-lockfile
        working-directory: n8n

      - name: Resolve editor-ui directory
        if: steps.already_done.outputs.skip == 'false'
        id: editorui
        run: |
          set -euo pipefail
          new_path="$GITHUB_WORKSPACE/n8n/packages/frontend/editor-ui"
          old_path="$GITHUB_WORKSPACE/n8n/packages/editor-ui"

          if [[ -d "$new_path" ]]; then
            echo "flag=new" >> "$GITHUB_OUTPUT"
            echo "dir=$new_path" >> "$GITHUB_OUTPUT"
          else
            echo "flag=old" >> "$GITHUB_OUTPUT"
            echo "dir=$old_path" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve locale directory
        if: steps.already_done.outputs.skip == 'false'
        id: locales
        run: |
          set -euo pipefail
          modern_locale_path="$GITHUB_WORKSPACE/n8n/packages/frontend/@n8n/i18n/src/locales"
          new_locale_path="${{ steps.editorui.outputs.dir }}/src/plugins/i18n/locales"
          old_locale_path="$GITHUB_WORKSPACE/n8n/packages/editor-ui/src/plugins/i18n/locales"

          if [[ -d "$modern_locale_path" ]]; then
            echo "dir=$modern_locale_path" >> "$GITHUB_OUTPUT"
          elif [[ -d "$new_locale_path" ]]; then
            echo "dir=$new_locale_path" >> "$GITHUB_OUTPUT"
          elif [[ -d "$old_locale_path" ]]; then
            echo "dir=$old_locale_path" >> "$GITHUB_OUTPUT"
          else
            echo "Unable to find locale directory in checked out n8n source" >&2
            exit 1
          fi

      - name: Build translation worklist
        if: steps.already_done.outputs.skip == 'false'
        id: worklist
        run: |
          set -euo pipefail
          work_dir="$GITHUB_WORKSPACE/.l10n-work"
          mkdir -p "$work_dir"
          new_en="${{ steps.locales.outputs.dir }}/en.json"
          old_en="$GITHUB_WORKSPACE/script/en.json"

          # 旧英語が無ければ全キーを新規扱い（空オブジェクトと比較）。
          old_src="$old_en"
          if [[ ! -f "$old_en" ]]; then
            echo '{}' > "$work_dir/old_en.json"
            old_src="$work_dir/old_en.json"
          fi

          # 追加キー・値変更キーのみを {JSONエンコードしたパス: 英語原文} で抽出。
          jq -n --slurpfile en "$new_en" --slurpfile old "$old_src" '
            ($en[0]) as $EN | ($old[0] // {}) as $O
            | reduce ($EN | paths(scalars)) as $p ({};
                (try ($O | getpath($p)) catch null) as $ov
                | ($EN | getpath($p)) as $nv
                | if ($ov == null) or ($ov != $nv) then .[$p | tojson] = $nv else . end)
          ' > "$work_dir/to_translate.json"

          count=$(jq 'length' "$work_dir/to_translate.json")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Keys needing translation: $count"

      - name: Install Claude Code CLI
        if: steps.already_done.outputs.skip == 'false' && steps.worklist.outputs.count != '0'
        env:
          CLAUDE_CODE_VERSION: "2.1.150"
        run: |
          set -euo pipefail
          # Pin a specific Claude Code release via npm so installs are
          # reproducible and don't silently follow a moving install.sh URL.
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version

      - name: Translate locale diff (Claude Code, chunked)
        if: steps.already_done.outputs.skip == 'false' && steps.worklist.outputs.count != '0'
        timeout-minutes: 60
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: "32000"
          CHUNK_SIZE: "40"
        run: bash "$GITHUB_WORKSPACE/script/translate-chunks.sh"

      - name: Validate translations
        if: steps.already_done.outputs.skip == 'false' && steps.worklist.outputs.count != '0'
        run: |
          set -euo pipefail
          work_dir="$GITHUB_WORKSPACE/.l10n-work"
          if [[ ! -f "$work_dir/translated.json" ]]; then
            echo "translated.json was not produced by Claude Code" >&2
            exit 1
          fi

          # 入力キーのうち、翻訳が欠落 or 空のものを列挙。
          missing=$(jq -n \
            --slurpfile s "$work_dir/to_translate.json" \
            --slurpfile t "$work_dir/translated.json" '
            ($s[0] | keys_unsorted) as $sk | ($t[0]) as $T
            | [ $sk[] | select(($T[.] | type) != "string" or ($T[.] | length) == 0) ]')

          n=$(echo "$missing" | jq 'length')
          if [[ "$n" != "0" ]]; then
            echo "Untranslated or missing keys: $n" >&2
            echo "$missing" | jq -r '.[0:20][]' >&2
            exit 1
          fi
          echo "All ${{ steps.worklist.outputs.count }} keys translated."

      - name: Merge translations into locale
        if: steps.already_done.outputs.skip == 'false'
        run: |
          set -euo pipefail
          work_dir="$GITHUB_WORKSPACE/.l10n-work"
          new_en="${{ steps.locales.outputs.dir }}/en.json"
          ja_file="$GITHUB_WORKSPACE/languages/ja.json"
          tr_file="$work_dir/translated.json"

          # 差分が無い場合（翻訳ステップ未実行）は空の翻訳で扱う。
          [[ -f "$tr_file" ]] || echo '{}' > "$tr_file"

          # 最新英語のキー順・構造を基準に ja.json を再構築する。
          # 優先順位: 今回の翻訳 > 既存の日本語訳 > （万一の欠落時）英語原文。
          # 上流で削除されたキーは最新英語に無いので自然に除外される。
          jq -n \
            --slurpfile en "$new_en" \
            --slurpfile cur "$ja_file" \
            --slurpfile tr "$tr_file" '
            ($en[0]) as $EN | ($cur[0]) as $C | ($tr[0]) as $T
            | reduce ($EN | paths(scalars)) as $p ({};
                ($T[$p | tojson]) as $tv
                | (try ($C | getpath($p)) catch null) as $cv
                | setpath($p;
                    if $tv != null then $tv
                    elif $cv != null then $cv
                    else ($EN | getpath($p)) end))
          ' > "$work_dir/ja_merged.json"

          mv "$work_dir/ja_merged.json" "$ja_file"
          cp "$new_en" "$GITHUB_WORKSPACE/script/en.json"
          echo "Merged ja.json keys: $(jq '[paths(scalars)] | length' "$ja_file")"

      - name: Apply Japanese locale and patch
        id: apply
        if: steps.already_done.outputs.skip == 'false'
        run: |
          set -euo pipefail
          cp -r "$GITHUB_WORKSPACE/languages"/* "${{ steps.locales.outputs.dir }}/"

          patch_applied=false
          for patch in fix_editor-ui.patch fix_editor-ui.old.patch; do
            if git -C "$GITHUB_WORKSPACE/n8n" apply --check "$GITHUB_WORKSPACE/$patch" >/dev/null 2>&1; then
              git -C "$GITHUB_WORKSPACE/n8n" apply "$GITHUB_WORKSPACE/$patch"
              echo "Applied patch: $patch"
              patch_applied=true
              break
            fi
          done

          if [[ "$patch_applied" == "false" ]]; then
            fixed_new_path="$GITHUB_WORKSPACE/n8n/packages/frontend/editor-ui/src/features/credentials/components/CredentialEdit/CredentialConfig.vue"
            fixed_old_path="$GITHUB_WORKSPACE/n8n/packages/frontend/editor-ui/src/components/CredentialEdit/CredentialConfig.vue"
            legacy_old_path="$GITHUB_WORKSPACE/n8n/packages/editor-ui/src/components/CredentialEdit/CredentialConfig.vue"
            app_vue_path="$GITHUB_WORKSPACE/n8n/packages/frontend/editor-ui/src/app/App.vue"

            if { [[ -f "$fixed_new_path" ]] && grep -Fq 'if (!credTranslation) return;' "$fixed_new_path"; } || \
               { [[ -f "$fixed_old_path" ]] && grep -Fq 'if (!credTranslation) return;' "$fixed_old_path"; } || \
               { [[ -f "$legacy_old_path" ]] && grep -Fq 'if (!credTranslation) return;' "$legacy_old_path"; } || \
               { [[ -f "$app_vue_path" ]] && grep -Fq "loadLanguage('ja'" "$app_vue_path"; }; then
              echo "Patch not applied, but upstream already contains the fix."
            else
              echo "No compatible editor-ui patch found; will attempt Claude Code repair." >&2
              echo "patch_repair_needed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "patch_repair_needed=false" >> "$GITHUB_OUTPUT"

      - name: Repair editor-ui patch (Claude Code)
        if: steps.already_done.outputs.skip == 'false' && steps.apply.outputs.patch_repair_needed == 'true'
        timeout-minutes: 30
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            fix_editor-ui.patch が ${{ github.workspace }}/n8n の editor-ui ソースへ
            適用できなかった。このパッチの目的は、editor-ui がランタイムで
            languages/ja.json を読み込めるようにする App.vue 等の改変
            （ソース内マーカー: loadLanguage('ja' ）。
            手順:
            1. fix_editor-ui.patch の意図と、現在の n8n editor-ui のディレクトリ構成を
               調査する（上流でファイルが移動・改名された可能性がある）。
            2. 同じ意図の変更を現行構成へ適用できるよう、リポジトリルートの
               fix_editor-ui.patch を再生成して上書きする。
            3. `git -C n8n apply --check fix_editor-ui.patch` が成功することを確認する。
            リポジトリルートの fix_editor-ui.patch のみを編集し、
            git の commit / push やブランチ作成はしないこと。
          claude_args: |
            --max-turns 80
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(find:*),Bash(grep:*),Bash(cat:*),Bash(ls:*)"

      - name: Re-apply repaired editor-ui patch
        if: steps.already_done.outputs.skip == 'false' && steps.apply.outputs.patch_repair_needed == 'true'
        run: |
          set -euo pipefail
          if git -C "$GITHUB_WORKSPACE/n8n" apply --check "$GITHUB_WORKSPACE/fix_editor-ui.patch" >/dev/null 2>&1; then
            git -C "$GITHUB_WORKSPACE/n8n" apply "$GITHUB_WORKSPACE/fix_editor-ui.patch"
            echo "Applied repaired patch: fix_editor-ui.patch"
          else
            echo "Claude Code repair did not produce an applicable patch." >&2
            exit 1
          fi

      - name: Ensure HtmlEditor dependency exists
        if: steps.already_done.outputs.skip == 'false'
        run: |
          set -euo pipefail
          workspace_pkg_dir="$GITHUB_WORKSPACE/n8n/packages/frontend/@n8n/codemirror-lang-html"
          editor_ui_pkg="${{ steps.editorui.outputs.dir }}/package.json"

          if [[ ! -f "$editor_ui_pkg" ]]; then
            echo "editor-ui package.json not found at: $editor_ui_pkg"
            exit 1
          fi

          if [[ ! -d "$workspace_pkg_dir" ]]; then
            echo "Workspace package not found: $workspace_pkg_dir"
            echo "Skip fallback install for @n8n/codemirror-lang-html"
            exit 0
          fi

          if grep -q '"@n8n/codemirror-lang-html"' "$editor_ui_pkg"; then
            echo "@n8n/codemirror-lang-html is already declared in editor-ui dependencies"
            exit 0
          fi

          pnpm --filter n8n-editor-ui add @n8n/codemirror-lang-html@workspace:* --no-frozen-lockfile
        working-directory: n8n

      - name: Build editor-ui with dependencies
        if: steps.already_done.outputs.skip == 'false'
        run: pnpm --filter n8n-editor-ui... build
        working-directory: n8n

      - name: Verify Japanese localization artifacts
        if: steps.already_done.outputs.skip == 'false'
        run: |
          set -euo pipefail
          assets_dir="${{ steps.editorui.outputs.dir }}/dist/assets"
          app_vue_path="$GITHUB_WORKSPACE/n8n/packages/frontend/editor-ui/src/app/App.vue"
          locale_file="${{ steps.locales.outputs.dir }}/ja.json"

          if [[ ! -d "$assets_dir" ]]; then
            echo "assets directory not found: $assets_dir" >&2
            exit 1
          fi

          ja_count=$(find "$assets_dir" -maxdepth 1 -type f -name 'ja-*.js' | wc -l | tr -d '[:space:]')
          echo "ja bundle count: $ja_count"

          if [[ "$ja_count" == "0" ]]; then
            echo "No Japanese chunk found in $assets_dir (ja-*.js)." >&2
            echo "Files containing 'ja' for debugging:" >&2
            find "$assets_dir" -maxdepth 1 -type f -iname '*ja*' -exec basename {} \; || true

            if [[ -f "$app_vue_path" ]] && grep -Fq "loadLanguage('ja'" "$app_vue_path" && [[ -f "$locale_file" ]]; then
              echo "Runtime ja.json loading patch detected and locale source exists: $locale_file"
              echo "Proceeding without ja-*.js chunk."
              exit 0
            fi

            echo "Neither ja-*.js chunks nor runtime ja loading patch was detected." >&2
            echo "Expected marker: loadLanguage('ja' in $app_vue_path" >&2
            echo "Expected locale file: $locale_file" >&2
            exit 1
          fi

      - name: Export editor-ui artifact
        if: steps.already_done.outputs.skip == 'false'
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/editor-ui-dist"
          cp -r "${{ steps.editorui.outputs.dir }}/dist" "$GITHUB_WORKSPACE/editor-ui-dist"
          cp "$GITHUB_WORKSPACE/languages/ja.json" "$GITHUB_WORKSPACE/editor-ui-dist/ja.json"
          tar -czf "$GITHUB_WORKSPACE/editor-ui.tar.gz" -C "$GITHUB_WORKSPACE" editor-ui-dist

      - name: Verify ja.json in editor-ui archive
        if: steps.already_done.outputs.skip == 'false'
        run: |
          set -euo pipefail
          archive_listing="$RUNNER_TEMP/editor-ui-archive-list.txt"
          tar -tzf "$GITHUB_WORKSPACE/editor-ui.tar.gz" > "$archive_listing"

          if ! grep -q '^editor-ui-dist/ja.json$' "$archive_listing"; then
            echo "ja.json is missing in editor-ui.tar.gz" >&2
            echo "Archive contents:" >&2
            head -n 50 "$archive_listing" >&2
            exit 1
          fi

      - name: Update version marker and compose image tag
        if: steps.already_done.outputs.skip == 'false'
        run: |
          set -euo pipefail
          echo "${{ steps.latest.outputs.version }}" > .n8n-upstream-version
          sed -i -E "s#(^\s*image:\s*n8nio/n8n:).*#\1${{ steps.latest.outputs.version }}#" docker-compose.yml

      - name: Create Pull Request
        if: steps.already_done.outputs.skip == 'false'
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.RELEASE_PAT }}
          branch: auto/n8n-${{ steps.latest.outputs.version }}-ja
          title: "chore: n8n ${{ steps.latest.outputs.version }} 日本語化更新"
          body: |
            ## 概要
            - n8n upstream: `${{ steps.latest.outputs.tag }}`
            - `script/en.json` を upstream から同期
            - `languages/ja.json` を再翻訳
            - `fix_editor-ui.patch` を upstream 構成に合わせて自動更新
            - `editor-ui-dist` を再生成
            - `docker-compose.yml` の n8n イメージタグ更新
            - `.n8n-upstream-version` を更新

            ## 検証
            - PR checks (format check / n8n smoke test) で確認します。
          commit-message: "chore: n8n ${{ steps.latest.outputs.version }} 日本語化更新"
          add-paths: |
            .n8n-upstream-version
            docker-compose.yml
            fix_editor-ui.patch
            languages/ja.json
            script/en.json
          delete-branch: true
          labels: |
            automated
            n8n-update

      - name: Enable auto-merge for PR
        if: steps.already_done.outputs.skip == 'false' &&
          steps.cpr.outputs.pull-request-number != ''
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.RELEASE_PAT }}
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: squash
