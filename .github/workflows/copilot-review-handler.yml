# Jenkins から投稿された統合レビューコメント（Copilot CLI / Claude Code CLI
# 両方の指摘を1本にまとめたもの）を受けて
#   - VERDICT: APPROVE → squash マージ + ブランチ削除
#   - VERDICT: REQUEST_CHANGES → claude-code-action で diff を機械修正 → push
#     (PR synchronize → Jenkins 再レビュー → ループ。上限到達で needs-human-review)
# する GitHub Actions ワークフロー。
#
# 配置先: jqit-yukiono/n8n-i18n-japanese リポジトリの
#   .github/workflows/copilot-review-handler.yml
# 本ファイルは jenkins-cli 側の参照コピー (templates)。
#
# 必要な repository variables / secrets:
#   vars.JENKINS_BOT_USERNAME       : Jenkins がコメント投稿に使う PAT 所有者の GitHub username
#   secrets.RELEASE_PAT             : push / マージ / claude-code-action 用 PAT
#   secrets.CLAUDE_CODE_OAUTH_TOKEN : claude-code-action 用 OAuth トークン
---
name: Copilot レビュー後の自動マージ / 自動修正

"on":
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: copilot-handler-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  # Jenkins側でCopilot CLI/Claude Code CLI両方の指摘を1本のコメントに
  # 統合してから投稿するため（jenkins-cli PR #161）、コメントはこの
  # マーカー1種類のみになった。
  COMMENT_MARKER: "## AI統合レビュー (n8n-i18n-japanese 翻訳観点)"
  MAX_RETRY: 5

jobs:
  triage:
    # 本文の先頭がマーカー、かつ Jenkins ボットの投稿だけを対象にする。
    if: |
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '## AI統合レビュー (n8n-i18n-japanese 翻訳観点)') &&
      github.event.comment.user.login == vars.JENKINS_BOT_USERNAME
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.parse.outputs.verdict }}
      eligible: ${{ steps.gate.outputs.eligible }}
      retry_count: ${{ steps.count.outputs.retry_count }}
      head_ref: ${{ steps.gate.outputs.head_ref }}
      labels: ${{ steps.gate.outputs.labels }}
      sha_match: ${{ steps.gate.outputs.sha_match }}
      reviewed_sha: ${{ steps.gate.outputs.reviewed_sha }}
    steps:
      - name: コメントから VERDICT を抽出（厳格マッチ）
        id: parse
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          VERDICT=$(printf '%s' "$BODY" \
            | tr -d '\r' \
            | grep -oE '^VERDICT: (APPROVE|REQUEST_CHANGES)$' \
            | tail -1 \
            | awk '{print $2}')
          echo "verdict=${VERDICT:-UNKNOWN}" >> "$GITHUB_OUTPUT"
          echo "VERDICT: ${VERDICT:-UNKNOWN}"

      - name: PR メタデータ取得 + ゲート判定
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          PR_JSON=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}")
          HEAD_REPO=$(printf '%s' "$PR_JSON" | jq -r '.head.repo.full_name // ""')
          HEAD_REF=$(printf '%s' "$PR_JSON" | jq -r '.head.ref')
          STATE=$(printf '%s' "$PR_JSON" | jq -r '.state')
          LABELS=$(printf '%s' "$PR_JSON" | jq -r '[.labels[].name] | join(",")')
          CURRENT_SHA=$(printf '%s' "$PR_JSON" | jq -r '.head.sha')
          echo "head_repo=$HEAD_REPO head_ref=$HEAD_REF state=$STATE labels=$LABELS"

          ELIGIBLE=false
          LABEL_OK=false
          case ",${LABELS}," in
            *,auto-heal,*|*,automated,*|*,n8n-update,*) LABEL_OK=true ;;
          esac
          BRANCH_OK=false
          case "${HEAD_REF}" in
            auto-heal/*|auto/n8n-*-ja) BRANCH_OK=true ;;
          esac
          if [ "$STATE" = "open" ] \
             && [ "$HEAD_REPO" = "${{ github.repository }}" ] \
             && [ "$LABEL_OK" = "true" ] \
             && [ "$BRANCH_OK" = "true" ]; then
            ELIGIBLE=true
          fi

          # n8n-i18n-japanese-pr-review.groovy はコメント本文の先頭を必ず
          # 「1行目: マーカー / 2行目: <!-- reviewed-sha: ... -->」という
          # 固定構造で出力する。本文全体を対象にした grep だと、外部入力
          # （diff）の影響を受ける生成本文（レビュー本文）がこの行を
          # たまたま引用・生成しただけで誤判定されてしまう（PR タイトル
          # 経由の偽装だけでなく、本文中の別の位置に同じ行が現れるケースも
          # 防げていなかった。実機レビュー指摘）。行全体一致だけでは
          # 不十分なため、Jenkins が実際に出力する行番号（2行目）だけを
          # 取り出して判定する。
          LINE2=$(printf '%s\n' "$BODY" | sed -n '2p')

          # 2行目の "<!-- reviewed-sha: <sha> -->" からレビュー対象コミット
          # を抽出し、現在の PR head と一致するかを見る。
          # fetchDiffForDualReview() の取得後チェックからレビュー統合完了
          # までの間にも push が入りうるため、自動マージ/自動修正は
          # reviewed SHA == 現在の head の場合だけに限定する（実機レビュー
          # 指摘、minewatch/eventwatch 向け PR #154 と同じ設計）。
          REVIEWED_SHA=$(printf '%s' "$LINE2" | grep -oE '^<!-- reviewed-sha: [0-9a-f]{7,40} -->$' | grep -oE '[0-9a-f]{7,40}' || true)
          SHA_MATCH=false
          if [ -n "$REVIEWED_SHA" ] && [ "$REVIEWED_SHA" = "$CURRENT_SHA" ]; then
            SHA_MATCH=true
          fi

          {
            echo "eligible=$ELIGIBLE"
            echo "head_ref=$HEAD_REF"
            echo "labels=$LABELS"
            echo "sha_match=$SHA_MATCH"
            echo "reviewed_sha=$REVIEWED_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "sha_match=$SHA_MATCH reviewed_sha=$REVIEWED_SHA current_sha=$CURRENT_SHA"

      - name: Jenkins レビューコメント数カウント（ループ上限判定用）
        id: count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          BOT: ${{ vars.JENKINS_BOT_USERNAME }}
          MARKER: ${{ env.COMMENT_MARKER }}
        run: |
          set -euo pipefail
          # contains($marker) だと、投稿者が同じ Jenkins bot で本文に
          # 攻撃者制御下の PR タイトル/生成レビューを含むコメントが、
          # たまたま（あるいは意図的に）マーカー文字列を含んでいた場合に
          # 誤カウントされ、give-up への到達を早めてしまう（実機レビュー
          # 指摘）。triage の if 条件と同じく startswith($marker) に統一し、
          # 本文の先頭が実際にマーカーであるコメントだけを数える。
          #
          # gh api --paginate は複数ページある場合、ページごとに独立した
          # JSON 配列をストリーム出力する。jq へそのまま渡すと
          # `[.[] | ...] | length` がページ単位で複数回評価され、
          # COUNT に複数行（例: "3\n2"）が入ってしまう（実機レビュー指摘）。
          # jq --slurp で全ページを1つの配列（配列の配列）にまとめてから
          # .[][] でフラット化し、単一の集計値にする。
          COUNT=$(gh api --paginate "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            | jq --slurp --arg user "$BOT" --arg marker "$MARKER" \
                 '[.[][] | select(
                     .user.login == $user and
                     (.body | startswith($marker))
                   )] | length')
          echo "retry_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Jenkins コメント数: $COUNT (上限: ${{ env.MAX_RETRY }})"

  auto-merge:
    needs: triage
    if: |
      needs.triage.outputs.eligible == 'true' &&
      needs.triage.outputs.verdict == 'APPROVE' &&
      needs.triage.outputs.sha_match == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: squash マージ + head ブランチ削除
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REVIEWED_SHA: ${{ needs.triage.outputs.reviewed_sha }}
        run: |
          set -euo pipefail
          # --auto: このリポジトリには branch protection の required status
          # check は設定されていないが（2026-08 時点で未設定）、pr-validate.yml
          # 等の他ワークフローが実行中の可能性があるため、それらの完了を
          # 待ってからマージする従来の挙動は維持する。
          # --match-head-commit: triage ジョブでの sha_match 判定からこの
          # ステップの実行までの間にも push が入る余地が残るため（実機
          # レビュー指摘、minewatch/eventwatch 向け PR #154 と同じ設計）、
          # 「auto-merge を予約する瞬間の PR head が REVIEWED_SHA と一致
          # する場合しか予約を許可しない」ことを GitHub API 側に保証させる。
          # 予約成功後に新しい push が入った場合に auto-merge が自動的に
          # 無効化される保証は無い点に注意（残存リスク。予約時点までの
          # レースだけを防ぐ）。
          gh pr merge "${PR_NUMBER}" \
            --squash \
            --delete-branch \
            --auto \
            --match-head-commit "${REVIEWED_SHA}" \
            --repo "${{ github.repository }}"
          echo "✓ PR #${PR_NUMBER} の squash マージをキューに登録しました（レビュー対象: ${REVIEWED_SHA}）"

  auto-fix:
    needs: triage
    if: |
      needs.triage.outputs.eligible == 'true' &&
      needs.triage.outputs.verdict == 'REQUEST_CHANGES' &&
      needs.triage.outputs.sha_match == 'true' &&
      needs.triage.outputs.retry_count != '' &&
      fromJSON(needs.triage.outputs.retry_count) < 5
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 対象 PR ブランチをチェックアウト
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: PR ブランチへ切替
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh pr checkout "${PR_NUMBER}"
          git config user.name "claude-code-action[bot]"
          git config user.email "claude-code-action[bot]@users.noreply.github.com"

      - name: stale build 再確認（checkout 後）
        env:
          REVIEWED_SHA: ${{ needs.triage.outputs.reviewed_sha }}
        run: |
          set -euo pipefail
          # マージ経路は --match-head-commit で「triage の sha_match 判定
          # から実行までの間の push」を GitHub API 側に保証させているが、
          # この auto-fix 経路は checkout してファイルを書き換え・commit・
          # push するミューテーションのため、同じ API オプションが無い。
          # triage 実行から gh pr checkout 完了までの間にも push が入り
          # うるため（実機レビュー指摘）、checkout 直後にもう一度
          # reviewed_sha と現在の HEAD を比較し、不一致ならここで中断する
          # （新しい push があった場合は、その push が起こす次の
          # synchronize イベントでの再レビュー・再判定に委ねる）。
          CURRENT_HEAD=$(git rev-parse HEAD)
          if [ "${CURRENT_HEAD}" != "${REVIEWED_SHA}" ]; then
            echo "checkout 後の HEAD (${CURRENT_HEAD}) が reviewed_sha (${REVIEWED_SHA}) と不一致。新しい push があったと判断し、自動修正を中断する。"
            exit 1
          fi
          echo "HEAD が reviewed_sha と一致（${CURRENT_HEAD}）。自動修正を続行する。"

      - name: claude-code-action で指摘事項を機械修正
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REVIEW_COMMENT: ${{ github.event.comment.body }}
          REVIEW_COMMENT_URL: ${{ github.event.comment.html_url }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.RELEASE_PAT }}
          prompt: |
            Jenkins から VERDICT: REQUEST_CHANGES が返った PR
            #${{ github.event.issue.number }} の指摘事項を機械的に修正するタスク。

            指摘元コメント:
            ${{ github.event.comment.html_url }}

            手順:
            1. 環境変数 REVIEW_COMMENT に入っているレビュー本文を読み、
               「対応すべき指摘事項」を列挙する（VERDICT 行や定型ヘッダーは除く）。
            2. 指摘事項のうち、以下の範囲に限定して機械的に修正可能なものだけ対応する:
                 - languages/ 配下の翻訳ファイル
                 - script/ 配下のスクリプト
                 - .github/workflows/ 配下のワークフロー
                 - Dockerfile / docker-compose.yml
            3. 修正が確定したら git add → コミット → push する。
               コミットメッセージは:
                 `chore: Copilot レビュー指摘 (#${{ github.event.issue.number }}) を自動修正`
            4. 判断必要 / 修正不能な指摘が残った場合は無理に修正せず、
               `gh pr comment` で「対応保留」項目を箇条書きで PR に明示してから終了する。
               このコメント本文の末尾には必ず独立した行で `/jenkins-re-review`
               を付ける（Jenkins 側がこのコマンドを検知してレビューコメントを
               再取得するため）。
            5. push 後、PR の synchronize で Jenkins が再レビューする。
               VERDICT が APPROVE になるまで本 workflow が再起動される。

            制約:
            - main への直接 push 禁止
            - 修正範囲は対象 PR ブランチのみ
            - 上流の n8n コード本体には触らない
            - ラベル / マージ操作はしない（マージは別 job が VERDICT: APPROVE 受信時に行う）
          claude_args: |
            --max-turns 60
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(gh:*),Bash(git:*),Bash(jq:*),Bash(cat:*),Bash(sed:*),Bash(ls:*),Bash(find:*),Bash(grep:*),Bash(head:*),Bash(tail:*),Bash(node:*)"

  give-up:
    needs: triage
    if: |
      needs.triage.outputs.eligible == 'true' &&
      needs.triage.outputs.verdict == 'REQUEST_CHANGES' &&
      needs.triage.outputs.sha_match == 'true' &&
      needs.triage.outputs.retry_count != '' &&
      fromJSON(needs.triage.outputs.retry_count) >= 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: 上限到達ラベル付与 + 人手依頼コメント
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh label create needs-human-review \
            -c E11D21 \
            -d "Copilot 自動修正の上限到達。人手レビュー必要" \
            --force 2>/dev/null || true
          gh pr edit "${PR_NUMBER}" \
            --add-label needs-human-review \
            --repo "${{ github.repository }}"
          gh pr comment "${PR_NUMBER}" \
            --repo "${{ github.repository }}" \
            --body "⚠️ Copilot 自動修正の上限 ${{ env.MAX_RETRY }} 回に到達しました。人手レビューと修正をお願いします。"

      - name: Slack に Copilot ループ上限到達を通知
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # PR タイトルは外部入力なので、シェル文字列に埋め込まず env 経由で
          # スクリプトへ渡す。Actions の `env:` 値はランナーが直接設定する
          # ため、テンプレート展開後にシェルで再解釈されない。
          SLACK_TEXT: "⚠️ Copilot 自動修正が上限 ${{ env.MAX_RETRY }} 回に到達: PR #${{ github.event.issue.number }} ${{ github.event.issue.title }} (needs-human-review)"
          SLACK_URL: ${{ github.event.issue.html_url }}
        run: bash "$GITHUB_WORKSPACE/script/slack-notify.sh"
